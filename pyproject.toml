[project]
name = "space-rescue-system"
version = "0.1.0"
requires-python = "==3.14.10"
dependencies = ["ortools==9.15.6755"]

[dependency-groups]
dev = [
    "ruff==0.17.5",
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "coverage==7.17.3",
    "import-linter==2.16",
]

[tool.uv]
required-version = "==0.13.8"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--import-mode=importlib --strict-markers"

[tool.coverage.run]
source = ["rescue"]
branch = true

[tool.coverage.report]
show_missing = true

[tool.importlinter]
root_package = "rescue"
include_external_packages = true
exclude_type_checking_imports = false

[[tool.importlinter.contracts]]
name = "domain-outward: Domain packages do not import application, adapters or bootstrap"
type = "forbidden"
source_modules = [
    "rescue.mission",
    "rescue.market",
    "rescue.mobilisation",
    "rescue.communication",
    "rescue.experiments.models",
    "rescue.experiments.results",
]
forbidden_modules = [
    "rescue.application",
    "rescue.adapters",
    "rescue.bootstrap",
]

[[tool.importlinter.contracts]]
name = "domain-io: Domain packages do not import I/O, environment, clock or network modules"
type = "forbidden"
source_modules = [
    "rescue.mission",
    "rescue.market",
    "rescue.mobilisation",
    "rescue.communication",
    "rescue.experiments.models",
    "rescue.experiments.results",
]
forbidden_modules = [
    "os",
    "time",
    "socket",
    "urllib",
    "http",
    "subprocess",
    "sqlite3",
    "requests",
    "httpx",
    "sqlalchemy",
]

[[tool.importlinter.contracts]]
name = "market-standalone: Market imports no other rescue package except rescue.values"
type = "forbidden"
source_modules = ["rescue.market"]
forbidden_modules = ["rescue.*"]
ignore_imports = ["rescue.market.** -> rescue.values"]

[[tool.importlinter.contracts]]
name = "application-no-memory: Only bootstrap imports the memory adapters"
type = "forbidden"
source_modules = ["rescue.application", "rescue.adapters.ports", "rescue.experiments", "rescue.demo"]
forbidden_modules = ["rescue.adapters.memory"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "mobilisation-peers-one-way: Mission and market do not import mobilisation"
type = "forbidden"
source_modules = ["rescue.mission", "rescue.market"]
forbidden_modules = ["rescue.mobilisation"]

[[tool.importlinter.contracts]]
name = "mission-isolated: Mission imports only rescue.values and the standard library"
type = "forbidden"
source_modules = ["rescue.mission"]
forbidden_modules = [
    "rescue.market",
    "rescue.mobilisation",
    "rescue.communication",
    "rescue.experiments",
    "rescue.application",
    "rescue.adapters",
    "rescue.bootstrap",
    "rescue.demo",
]

[[tool.importlinter.contracts]]
name = "mobilisation-allowed-imports: Mobilisation imports no communication, experiments or outer layers"
type = "forbidden"
source_modules = ["rescue.mobilisation"]
forbidden_modules = [
    "rescue.communication",
    "rescue.experiments",
    "rescue.application",
    "rescue.adapters",
    "rescue.bootstrap",
    "rescue.demo",
]

[[tool.importlinter.contracts]]
name = "mobilisation-layers: Services sit above algorithms above models"
type = "layers"
layers = [
    "rescue.mobilisation.services",
    "rescue.mobilisation.algorithms",
    "rescue.mobilisation.models",
]

[[tool.importlinter.contracts]]
name = "mobilisation-solver-isolated: Models and services do not import ortools directly"
type = "forbidden"
source_modules = ["rescue.mobilisation.models", "rescue.mobilisation.services"]
forbidden_modules = ["ortools"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "mission-layers: Mission rules build on models, never the reverse"
type = "layers"
layers = [
    "rescue.mission.rules",
    "rescue.mission.models",
]

[[tool.importlinter.contracts]]
name = "communication-isolated: Communication imports only rescue.values and the standard library"
type = "forbidden"
source_modules = ["rescue.communication"]
forbidden_modules = [
    "rescue.mission",
    "rescue.market",
    "rescue.mobilisation",
    "rescue.experiments",
    "rescue.application",
    "rescue.adapters",
    "rescue.bootstrap",
    "rescue.demo",
]

[[tool.importlinter.contracts]]
name = "communication-layers: Communication rules build on models, never the reverse"
type = "layers"
layers = [
    "rescue.communication.rules",
    "rescue.communication.models",
]

[[tool.importlinter.contracts]]
name = "adapters-inward: Adapters import only application.state, values and the standard library"
type = "forbidden"
source_modules = ["rescue.adapters"]
forbidden_modules = [
    "rescue.bootstrap",
    "rescue.demo",
    "rescue.experiments",
    "rescue.application.central",
    "rescue.application.contracts",
    "rescue.mission",
    "rescue.market",
    "rescue.mobilisation",
    "rescue.communication",
]
allow_indirect_imports = true
